name = "name-vitals-ingest"
main = "src/index.ts"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "name-vitals"
database_id = "fc4741db-1f6d-457c-b4e4-675a4ea3ebc2"

[[r2_buckets]]
binding = "INGEST_CACHE"
bucket_name = "name-vitals-ingest"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "name-ingest"

[[queues.consumers]]
queue = "name-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "name-ingest-dlq"

[vars]
SSA_URL = "https://www.ssa.gov/oact/babynames/names.zip"

# SSA releases the new year's names dataset on Mother's Day each May. The
# scheduled() handler in src/index.ts checks the ETag before re-ingesting,
# so running daily through May costs nothing if the dataset hasn't changed.
# Outside the May release window, weekly is plenty.
[triggers]
crons = [
  "0 14 * 5 *",        # Daily at 14:00 UTC during May (release window)
  "0 14 * 1-4,6-12 1", # Weekly Mondays 14:00 UTC, outside May
]
