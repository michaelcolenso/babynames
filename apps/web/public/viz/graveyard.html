<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Graveyard — NobodyNamed</title>
<meta name="description" content="A memorial for extinct American baby names. Every dot is a name that once was given to thousands of children — and then stopped entirely.">
<link rel="canonical" href="https://nobodynamed.com/viz/graveyard">
<meta property="og:title" content="The Graveyard — NobodyNamed">
<meta property="og:description" content="Names that vanished. Every dot is a real American name that went extinct.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://nobodynamed.com/api/og/default">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080808;
    --bg2: #0f0f0f;
    --text: #d4cfc8;
    --muted: #5c5750;
    --rule: rgba(255,255,255,0.07);
    --accent: #c4995a;
  }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  nav {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.85rem;
  }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--text); }
  nav .brand { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--accent); letter-spacing: 0.1em; margin-right: auto; }

  .hero {
    padding: 3rem 2rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .kicker {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 1rem;
    color: var(--text);
  }
  .lede {
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 600px;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  .controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding: 0 2rem;
    max-width: 900px;
    margin: 0 auto 1.5rem;
  }
  .btn {
    padding: 0.35rem 0.9rem;
    border-radius: 20px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #000; }

  #chart-wrap {
    position: relative;
    padding: 0 1rem;
  }
  svg { display: block; width: 100%; }

  .grave { cursor: pointer; }
  .grave:hover .tomb { filter: brightness(1.6); }
  .grave text { pointer-events: none; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(8,8,8,0.97);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    z-index: 1000;
    max-width: 260px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    opacity: 0;
    transition: opacity 0.1s;
  }
  .tooltip .name { font-weight: 700; font-size: 1.1rem; color: var(--text); margin-bottom: 6px; }
  .tooltip .epitaph { color: var(--muted); font-size: 0.82rem; line-height: 1.5; }
  .tooltip .epitaph span { color: var(--accent); }

  .legend {
    display: flex;
    gap: 2rem;
    align-items: center;
    padding: 1rem 2rem;
    max-width: 900px;
    margin: 0.5rem auto 2rem;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }
  .legend-item { display: flex; align-items: center; gap: 0.5rem; }
  .legend-swatch {
    width: 32px; height: 6px; border-radius: 3px;
  }

  #loading {
    text-align: center;
    padding: 6rem 2rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
  }

  .axis-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    fill: #5c5750;
    letter-spacing: 0.05em;
  }

  .fog-overlay { pointer-events: none; }

  @media (max-width: 640px) {
    .hero, .controls { padding-left: 1rem; padding-right: 1rem; }
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<nav>
  <span class="brand">NOBODYNAMED</span>
  <a href="/viz/">← Visualizations</a>
  <a href="/">Home</a>
</nav>

<div class="hero">
  <div class="kicker">14 / The Memorial</div>
  <h1>The Graveyard</h1>
  <p class="lede">Every dot is a real name once given to thousands of American children — that no parent chose in the last decade. Hover to read the epitaph.</p>
</div>

<div class="controls">
  <button class="btn active" data-sex="all">All names</button>
  <button class="btn" data-sex="F">Girls' names</button>
  <button class="btn" data-sex="M">Boys' names</button>
</div>

<div id="chart-wrap">
  <div id="loading">EXHUMING RECORDS…</div>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-swatch" style="background: linear-gradient(90deg, #4a5568, #c4995a)"></div>
    <span>older extinction → recent</span>
  </div>
  <div class="legend-item">
    <svg width="40" height="14">
      <circle cx="7" cy="7" r="3.5" fill="#c4995a" opacity="0.7"/>
      <circle cx="22" cy="7" r="6" fill="#c4995a" opacity="0.7"/>
      <circle cx="36" cy="7" r="4.5" fill="#c4995a" opacity="0.7"/>
    </svg>
    <span>size = peak count</span>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const W = Math.min(window.innerWidth, 1200);
const margin = { top: 40, right: 40, bottom: 70, left: 90 };
const height = Math.min(580, window.innerHeight * 0.65);

let allRows = [], activeSex = 'all';

const colorInterp = d3.interpolateRgb('#4a5568', '#c4995a');

function graveColor(lastYear, ym, yM) {
  return colorInterp((lastYear - ym) / (yM - ym));
}

function sizeR(peakCount) {
  return Math.sqrt(peakCount / 500) * 1.5 + 2.5;
}
function sizeR_clamped(peakCount) {
  return Math.min(sizeR(peakCount), 18);
}

function tombstonePath(r) {
  const w = r * 1.1, h = r * 1.8;
  return `M ${-w} ${h/2} L ${-w} ${0} A ${w} ${w*0.9} 0 1 1 ${w} 0 L ${w} ${h/2} Z`;
}

function drawChart(rows) {
  d3.select('#loading').remove();
  d3.select('#chart-wrap svg').remove();

  const w = document.getElementById('chart-wrap').clientWidth || W;
  const innerW = w - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const ym = d3.min(rows, d => d.lastYearSeen) - 2;
  const yM = d3.max(rows, d => d.lastYearSeen) + 2;
  const peakMax = d3.max(rows, d => d.peakCount);

  const xScale = d3.scaleLinear().domain([ym, yM]).range([0, innerW]);
  const yScale = d3.scaleLog()
    .domain([d3.min(rows, d => d.peakCount) * 0.7, peakMax * 1.3])
    .range([innerH, 0])
    .clamp(true);

  const svg = d3.select('#chart-wrap').append('svg')
    .attr('width', w)
    .attr('height', height)
    .attr('viewBox', `0 0 ${w} ${height}`);

  // Fog filter
  const defs = svg.append('defs');
  const filter = defs.append('filter').attr('id', 'fog');
  filter.append('feGaussianBlur').attr('stdDeviation', 2);

  // Atmosphere
  const radGrad = defs.append('radialGradient').attr('id', 'fogGrad')
    .attr('cx', '50%').attr('cy', '80%').attr('r', '60%');
  radGrad.append('stop').attr('offset', '0%').attr('stop-color', '#1a0f00').attr('stop-opacity', 0);
  radGrad.append('stop').attr('offset', '100%').attr('stop-color', '#040404').attr('stop-opacity', 0.7);

  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  // Grid lines
  const yTicks = yScale.ticks(5);
  g.selectAll('.grid-h')
    .data(yTicks)
    .join('line')
    .attr('class', 'grid-h')
    .attr('x1', 0).attr('x2', innerW)
    .attr('y1', d => yScale(d)).attr('y2', d => yScale(d))
    .attr('stroke', 'rgba(255,255,255,0.04)').attr('stroke-dasharray', '3,4');

  // Decade grid lines
  const decades = d3.range(Math.ceil(ym / 10) * 10, yM, 10);
  g.selectAll('.grid-v')
    .data(decades)
    .join('line')
    .attr('class', 'grid-v')
    .attr('x1', d => xScale(d)).attr('x2', d => xScale(d))
    .attr('y1', 0).attr('y2', innerH)
    .attr('stroke', 'rgba(255,255,255,0.04)').attr('stroke-dasharray', '2,6');

  // Axes
  const xAxis = d3.axisBottom(xScale).tickFormat(d => `${d}`).tickSize(6);
  const yAxis = d3.axisLeft(yScale)
    .tickFormat(d => d >= 1000 ? `${d/1000}k` : d)
    .tickSize(6);

  g.append('g').attr('class', 'x-axis')
    .attr('transform', `translate(0,${innerH})`)
    .call(xAxis)
    .call(ax => {
      ax.select('.domain').attr('stroke', 'rgba(255,255,255,0.1)');
      ax.selectAll('text').attr('fill', '#5c5750').attr('font-family', 'Space Mono, monospace').attr('font-size', 11);
      ax.selectAll('line').attr('stroke', 'rgba(255,255,255,0.1)');
    });

  g.append('g').attr('class', 'y-axis')
    .call(yAxis)
    .call(ax => {
      ax.select('.domain').attr('stroke', 'rgba(255,255,255,0.1)');
      ax.selectAll('text').attr('fill', '#5c5750').attr('font-family', 'Space Mono, monospace').attr('font-size', 10);
      ax.selectAll('line').attr('stroke', 'rgba(255,255,255,0.1)');
    });

  // Axis labels
  g.append('text').attr('class', 'axis-label')
    .attr('x', innerW / 2).attr('y', innerH + 52)
    .attr('text-anchor', 'middle')
    .text('YEAR LAST RECORDED');

  g.append('text').attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -innerH / 2).attr('y', -72)
    .attr('text-anchor', 'middle')
    .text('PEAK POPULARITY (BIRTHS)');

  // Jitter to avoid overlap
  const jitter = d3.randomNormal(0, 0.4);

  // Graves
  const graves = g.selectAll('.grave')
    .data(rows)
    .join('g')
    .attr('class', 'grave')
    .attr('transform', d => {
      const x = xScale(d.lastYearSeen + jitter());
      const y = yScale(d.peakCount);
      return `translate(${x},${y})`;
    });

  graves.append('path')
    .attr('class', 'tomb')
    .attr('d', d => tombstonePath(sizeR_clamped(d.peakCount)))
    .attr('fill', d => graveColor(d.lastYearSeen, ym, yM))
    .attr('opacity', 0.65)
    .attr('stroke', d => graveColor(d.lastYearSeen, ym, yM))
    .attr('stroke-width', 0.5)
    .attr('stroke-opacity', 0.3);

  // Tiny cross on large tombstones
  graves.filter(d => sizeR_clamped(d.peakCount) > 8)
    .append('line')
    .attr('x1', 0).attr('x2', 0)
    .attr('y1', d => -sizeR_clamped(d.peakCount) * 0.6)
    .attr('y2', d => -sizeR_clamped(d.peakCount) * 0.1)
    .attr('stroke', d => graveColor(d.lastYearSeen, ym, yM))
    .attr('stroke-width', 1.2)
    .attr('stroke-opacity', 0.5);

  graves.filter(d => sizeR_clamped(d.peakCount) > 8)
    .append('line')
    .attr('x1', d => -sizeR_clamped(d.peakCount) * 0.3)
    .attr('x2', d => sizeR_clamped(d.peakCount) * 0.3)
    .attr('y1', d => -sizeR_clamped(d.peakCount) * 0.45)
    .attr('y2', d => -sizeR_clamped(d.peakCount) * 0.45)
    .attr('stroke', d => graveColor(d.lastYearSeen, ym, yM))
    .attr('stroke-width', 1.2)
    .attr('stroke-opacity', 0.5);

  // Name labels for large ones
  graves.filter(d => d.peakCount > 25000)
    .append('text')
    .attr('y', d => sizeR_clamped(d.peakCount) * 1.4)
    .attr('text-anchor', 'middle')
    .attr('fill', '#6b7280')
    .attr('font-size', 9)
    .attr('font-family', 'Space Mono, monospace')
    .text(d => d.name.toUpperCase());

  // Fog overlay
  svg.append('rect')
    .attr('class', 'fog-overlay')
    .attr('width', w).attr('height', height)
    .attr('fill', 'url(#fogGrad)');

  // Tooltip
  const tip = d3.select('#tooltip');
  graves
    .on('mousemove', (event, d) => {
      const gap = (new Date().getFullYear()) - d.lastYearSeen;
      tip.style('opacity', 1)
        .style('left', `${Math.min(event.clientX + 16, window.innerWidth - 280)}px`)
        .style('top', `${event.clientY - 60}px`)
        .html(`
          <div class="name">${d.name} (${d.sex === 'F' ? 'girl' : 'boy'})</div>
          <div class="epitaph">
            Peaked at <span>${d.peakCount.toLocaleString()}</span> babies in <span>${d.peakYear}</span><br>
            Last recorded: <span>${d.lastYearSeen}</span><br>
            Gone for <span>${gap} year${gap !== 1 ? 's' : ''}</span>
          </div>
        `);
    })
    .on('mouseleave', () => tip.style('opacity', 0))
    .on('click', (e, d) => {
      window.open(`/name/${d.name.toLowerCase()}`, '_blank');
    });

  // Entrance animation
  graves.attr('opacity', 0)
    .transition().duration(600)
    .delay((d, i) => i * 2)
    .attr('opacity', 1);
}

function filterAndDraw() {
  const rows = activeSex === 'all' ? allRows : allRows.filter(r => r.sex === activeSex);
  drawChart(rows);
}

// Controls
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSex = btn.dataset.sex;
    filterAndDraw();
  });
});

// Fetch data
fetch('/api/landing/extinct')
  .then(r => r.json())
  .then(data => {
    allRows = data.rows;
    filterAndDraw();
  })
  .catch(() => {
    document.getElementById('loading').textContent = 'Could not load data.';
  });

window.addEventListener('resize', () => {
  if (allRows.length) filterAndDraw();
});
</script>
</body>
</html>
