name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

# One deploy at a time, in push order. A newer push waits for the running
# deploy instead of racing it, and is never cancelled halfway through.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same checks as validate.yml. A push straight to master, or a merge
      # whose PR checks went stale, must not ship code that fails them.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN secret is not set" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID secret is not set" && exit 1)

      - name: Build shared package
        run: npm run build

      - name: Deploy web (Pages)
        run: npm run deploy:web

      - name: Deploy ingest worker
        run: npm run deploy:ingest