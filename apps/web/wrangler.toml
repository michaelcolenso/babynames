name = "nobodynamed"
compatibility_date = "2026-05-03"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "name-vitals"
database_id = "fc4741db-1f6d-457c-b4e4-675a4ea3ebc2"
migrations_dir = "../../migrations"

[[services]]
binding = "ENRICH_WORKER"
service = "name-vitals-ingest"

# Cloudflare AI Search (formerly AutoRAG) — semantic / RAG search over indexed
# content. Backs /api/ai-search and /api/ai-search/ask. Change `instance_name`
# to match the AI Search instance created in your Cloudflare dashboard.
[[ai_search]]
binding = "AI_SEARCH"
instance_name = "broken-unit-f69e"
