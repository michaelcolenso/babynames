name = "name-vitals-ingest"
main = "src/index.ts"
compatibility_date = "2026-05-03"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "name-vitals"
database_id = "fc4741db-1f6d-457c-b4e4-675a4ea3ebc2"

[[r2_buckets]]
binding = "INGEST_CACHE"
bucket_name = "name-vitals-ingest"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "name-ingest"

[[queues.consumers]]
queue = "name-ingest"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "name-ingest-dlq"

[vars]
SSA_URL = "https://www.ssa.gov/oact/babynames/names.zip"
STATE_SSA_URL = "https://www.ssa.gov/oact/babynames/state/namesbystate.zip"

# SSA releases new data once per year (typically May). The scheduled() handler
# checks the ETag so runs cost nothing when the dataset hasn't changed.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 14 * * 1"] # Weekly Mondays 14:00 UTC
