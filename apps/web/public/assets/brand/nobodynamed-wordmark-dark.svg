<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Nobody Named wordmark dark</title>
  <desc id="desc">Two-state Name Vitals wordmark for dark backgrounds, with nobody in paper and named in muted stone gray.</desc>
  <rect width="1600" height="360" fill="none"/>
  <g font-family="'Source Serif 4','Roboto Slab','Iowan Old Style',Georgia,serif" font-weight="900" font-size="250" letter-spacing="-8">
    <text x="40" y="250" fill="#FAF8F2">nobody</text>
    <text x="835" y="250" fill="#7E7A6E">named</text>
  </g>
</svg>
