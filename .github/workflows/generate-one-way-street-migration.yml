name: Generate one-way-street blog migration

on:
  push:
    branches:
      - feat/content-one-way-street

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate migration
        run: npm run blog:publish -- content/blog/one-way-street.md
      - name: Commit generated migration and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-one-way-street-migration.yml
          git add migrations
          git diff --cached --stat
          git commit -m "fix: publish one-way-street blog migration"
          git push
